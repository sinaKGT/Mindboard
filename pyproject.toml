[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindboard"
version = "0.1.0"
description = "Map your mind to a board. A local-first multimodal graph canvas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.0",
  "pillow>=10.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mindboard = "mindboard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindboard"]

[tool.hatch.build.targets.wheel.force-include]
"src/mindboard/web" = "mindboard/web"

[tool.ruff]
line-length = 100

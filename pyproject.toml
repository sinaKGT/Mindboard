[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindboard"
version = "0.1.0"
description = "Map your mind to a board. A local-first multimodal graph canvas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "rich>=13.0",
  "pillow>=10.0",
  "httpx>=0.27",
  # Ask your board's search index (search_index.py): Tantivy for exact and
  # stemmed keyword search, numpy for exact vector search
  "tantivy>=0.27",
  "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "hatchling>=1.24"]

[project.scripts]
mindboard = "mindboard.cli:main"

[tool.hatch.build.targets.wheel]
# Everything under the package directory ships, the built interface included.
# Do NOT add a force-include for src/mindboard/web: it makes an *editable*
# install copy that one folder into site-packages and skip the .pth entirely,
# so `import mindboard` finds an empty namespace package and every submodule
# disappears. See tests/test_packaging.py.
packages = ["src/mindboard"]
# The built interface is gitignored, so hatchling would skip it; `artifacts`
# includes it without remapping any path.
artifacts = ["src/mindboard/web/**"]

[tool.ruff]
line-length = 100
